<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF‑8">
    <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
    <title>发动机故障预警系统</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
        body{background:#f5f7fa;padding:30px;max-width:800px;margin:0 auto}
        h1{text-align:center;margin-bottom:24px;color:#222}
        .box{background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 8px #00000015}
        textarea{width:100%;height:140px;padding:12px;border:1px solid #ccc;border-radius:6px;font-size:14px;resize:none;margin-bottom:16px}
        button{width:100%;padding:12px;background:#2b7bdd;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
        #result{margin-top:20px;padding:16px;border-radius:6px;border:1px solid #eee}
    </style>
</head>
<body>
    <h1>涡轮发动机故障预警</h1>
    <div class="box">
        <p>输入50步传感器时序数据（数组格式）</p >
        <textarea id="inputSeq" placeholder="[0.12,0.34,...一共50个数据]"></textarea>
        <button onclick="sendPredict()">提交预测</button>
        <div id="result"></div>
    </div>

    <script>
        const apiUrl = "http://127.0.0.1:8000/predict";
        async function sendPredict(){
            const dom = document.getElementById("inputSeq");
            const resDom = document.getElementById("result");
            try{
                const arr = JSON.parse(dom.value);
                const resp = await fetch(apiUrl,{
                    method:"POST",
                    headers:{"Content‑Type":"application/json"},
                    body:JSON.stringify({"sensor_seq":arr})
                })
                const data = await resp.json();
                resDom.innerHTML = `
                    <p>故障概率：${data.fault_probability}</p >
                    <p>风险标识：${data.is_fault_risk===1?"⚠️存在故障风险":"✅设备正常"}</p >
                `
            }catch(e){
                resDom.innerHTML = `<p style="color:red">输入格式错误或后端服务未启动</p >`
            }
        }
    </script>
</body>
</html>
